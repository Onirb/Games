[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-games-collection"
version = "0.1.0"
description = "Three testable terminal games extracted from legacy Jupyter notebooks."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
mini-games = "mini_games.cli:main"
mini-games-gui = "mini_games.gui:main"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
